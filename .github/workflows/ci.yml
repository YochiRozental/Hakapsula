name: CI

# רץ על כל push ל-main, על כל Pull Request שמיועד ל-main, על ענפי test/* (לדיבוג ידני), וידנית (workflow_dispatch).
# לעולם לא נוגע ב-Neon/Production: המסד היחיד שבו העבודה הזו משתמשת הוא קונטיינר Postgres חד-פעמי שנוצר ונמחק
# באותה הרצה בלבד. זו תשתית הבדיקות הקבועה של הפרויקט — ראו bookings-payment.test.ts ועוד לדוגמאות לבדיקות
# אינטגרציה חדשות שמצטרפות אוטומטית (כל קובץ *_TEST_DATABASE_URL חדש צריך גם שורה כאן ובשלבי יצירת/מיגרציית המסד).
on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # סיסמה חד-פעמית לקונטיינר הבדיקות של ההרצה הזו בלבד — לא סוד אמיתי, לא קשורה לשום סביבה אחרת
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_ephemeral_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: ci
      PGPASSWORD: ci_ephemeral_pw
      # DATABASE_URL למעטפת/build/tsc/lint: מצביע על מסד ייעודי שמ-migrate-ים אותו לפני השימוש (ל-/admin יש
      # קריאת DB בזמן build, ensureRooms). לעולם לא Neon — תמיד הקונטיינר החד-פעמי הזה בלבד.
      DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_build_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create isolated per-suite test databases (ephemeral container only)
        run: |
          set -e
          for db in clinics_build_test clinics_payments_test clinics_savedcard_test clinics_packages_test \
                    clinics_finance_test clinics_ivrpay_test clinics_concurrency_test \
                    clinics_pin_test clinics_shifts_test clinics_ivr_test; do
            psql -h localhost -U ci -d postgres -c "CREATE DATABASE $db;"
          done

      - name: Apply the new migration (and full history) to each test database
        run: |
          set -e
          for db in clinics_build_test clinics_payments_test clinics_savedcard_test clinics_packages_test \
                    clinics_finance_test clinics_ivrpay_test clinics_concurrency_test \
                    clinics_pin_test clinics_shifts_test clinics_ivr_test; do
            DATABASE_URL="postgresql://ci:ci_ephemeral_pw@localhost:5432/$db" npx prisma migrate deploy
          done

      - name: ESLint
        run: npm run lint

      # /admin עושה קריאת DB בזמן prerender (ensureRooms) — זקוק ל-DATABASE_URL תקין ומוגר כבר בשלב הזה.
      # next build גם מייצר טיפוסי-עזר לנתיבים (LayoutProps וכו') תחת .next/types, חסרים ב-checkout נקי.
      - name: Build
        run: npm run build

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Run full test suite
        env:
          PAYMENTS_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_payments_test
          SAVEDCARD_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_savedcard_test
          PACKAGES_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_packages_test
          FINANCE_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_finance_test
          IVRPAY_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_ivrpay_test
          TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_concurrency_test
          PIN_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_pin_test
          SHIFTS_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_shifts_test
          IVR_TEST_DATABASE_URL: postgresql://ci:ci_ephemeral_pw@localhost:5432/clinics_ivr_test
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          {
            echo "## Test run exit code: $code"
            echo
            echo "### Summary line"
            grep -E "^(ℹ|# )(tests|pass|fail|cancelled|skipped)" test-output.log || true
            echo
            echo "### Failures (✖ / not ok)"
            grep -n -B1 -A15 "✖\|not ok" test-output.log | head -400 || echo "(none matched)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat test-output.log
          exit $code
